name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest --cov=dns_sentinel --cov-report=term-missing
      - run: ruff check .
      - run: mypy
      - run: python -m build
      - name: Smoke test installed CLI from wheel
        # Installs the built wheel into a fresh venv and runs it from outside the
        # checkout, so a broken entry point or missing package files fail here.
        # Only --help is invoked: no DNS queries are made.
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/smoke-venv"
          "$RUNNER_TEMP/smoke-venv/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke-venv/bin/dns-sentinel" --help
