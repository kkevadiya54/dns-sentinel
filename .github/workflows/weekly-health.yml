name: Hourly project health

on:
  schedule:
    # Run near the top of each hour; GitHub Actions schedules use UTC.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest --cov=dns_sentinel --cov-report=term-missing
      - run: ruff check .
      - run: mypy
      - run: python -m build
      - name: Report external contributors
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/community_metrics.py
